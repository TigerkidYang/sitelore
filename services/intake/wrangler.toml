name = "sitelore-intake"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Development: the test data repo. There is no official data repo yet (the `sitelore`
# GitHub org belongs to an unrelated project), so set this to a repo you control.
DATA_REPO = "TigerkidYang/sitelore-data-test"

# Secrets (wrangler secret put ...):
#   GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY (PKCS#8 PEM), GITHUB_INSTALLATION_ID
#   or, for testing, GITHUB_TOKEN (a bot account token with push access to DATA_REPO)

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

name: publish

# Rebuilds bundles/<host>.json and hosts.json and commits them to the
# `bundles` branch, which clients read from raw.githubusercontent.com.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: publish

env:
  # The code repo this data repo trusts to run with write access. Must be a repo you control.
  SITELORE_CODE_REPO: TigerkidYang/sitelore
  # Pin the tooling to a release tag or commit SHA, never a branch: publish.yml can write to this repo.
  SITELORE_TOOLS_REF: eac26f90eed2bf37c650833f0aeee780408bd72a

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.SITELORE_CODE_REPO }}
          ref: ${{ env.SITELORE_TOOLS_REF }}
          path: .sitelore-tools
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build tools
        working-directory: .sitelore-tools
        run: npm ci && npm run build -w packages/core && npm run build -w packages/data-tools
      - name: Build bundles
        run: |
          node .sitelore-tools/packages/data-tools/dist/cli.js build --root . --out "$RUNNER_TEMP/bundles"
          cp LICENSE "$RUNNER_TEMP/bundles/LICENSE"
      - name: Push bundles branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/bundles"
          git init -q -b bundles
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          status=0
          git ls-remote --exit-code --heads origin bundles > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin bundles
            # Keep freshly generated files, but use the previous bundle commit as parent.
            git reset --mixed FETCH_HEAD
          elif [ "$status" -ne 2 ]; then
            exit "$status"
          fi
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Bundles for ${GITHUB_SHA}"
          git push origin HEAD:bundles
